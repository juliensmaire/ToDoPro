<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Calendrier TodoPro</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        button {
            background-color: #333333;
            color: #e0e0e0;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background-color: #444444;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333333;
            border-radius: 6px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #cccccc;
            font-size: 0.95em;
        }

        .top-tabs {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 0 0 16px;
            border-bottom: 1px solid #333333;
            padding-bottom: 8px;
        }

        .top-tab {
            color: #e0e0e0;
            text-decoration: none;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 8px 14px;
            line-height: 1;
        }

        .top-tab:hover {
            background-color: #2a2a2a;
        }

        .top-tab.active {
            background-color: #444444;
            border-color: #666666;
            color: #ffffff;
            font-weight: 600;
        }

        #cloud-status {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 1000;
            background: #222222;
            color: #dddddd;
            border: 1px solid #333333;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0.9;
            pointer-events: none;
            white-space: nowrap;
            display: none;
        }

        #cloud-status.ok {
            border-color: #2ecc71;
            color: #bff3cf;
        }

        #cloud-status.err {
            border-color: #e74c3c;
            color: #ffd3ce;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            width: min(420px, 90vw);
            color: #e0e0e0;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin: 0 0 8px;
        }

        .modal p {
            margin: 0 0 12px;
            color: #bbbbbb;
        }

        .modal .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .modal .error {
            color: #ff8a8a;
            display: none;
            font-size: 12px;
            margin-top: 6px;
        }

        .todo-task-modal {
            width: min(720px, 94vw);
            max-height: 88vh;
            overflow: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .modal-close-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            font-size: 22px;
            line-height: 1;
            flex: 0 0 auto;
        }

        .modal-status {
            min-height: 16px;
            margin: 0 0 10px;
            font-size: 12px;
            color: #bbbbbb;
        }

        .modal-status.err {
            color: #ff8a8a;
        }

        .modal-status.ok {
            color: #bff3cf;
        }

        .todo-modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .todo-modal-full {
            grid-column: 1 / -1;
        }

        .todo-modal-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px;
        }

        .todo-modal-check input {
            width: auto;
            margin: 0;
        }

        .todo-modal-subtasks {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .modal-subtask-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
        }

        .modal-subtask-row input[type="checkbox"] {
            margin: 0;
        }

        .modal-subtask-row input[type="text"] {
            margin-bottom: 0;
        }

        .modal-subtask-remove {
            padding: 7px 9px;
            background: #3a2424;
        }

        .modal-subtask-remove:hover {
            background: #513030;
        }

        .modal-subtask-add {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
        }

        .modal-subtask-add input {
            margin-bottom: 0;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 16px;
        }

        #calendar-title-input {
            font-size: 1.4em;
            font-weight: 600;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 0 0 1px #444444 inset;
        }

        .calendar-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .view-switcher,
        .calendar-toolbar-actions,
        .calendar-period-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-mode-btn.active {
            background-color: #555555;
            box-shadow: 0 0 0 1px #777777 inset;
            font-weight: 600;
        }

        #toggle-todo-periods-btn.active {
            background-color: #45502a;
            box-shadow: 0 0 0 1px #7a8a42 inset;
        }

        .calendar-period-nav {
            flex: 1 1 420px;
            min-width: 280px;
        }

        #calendar-month-label {
            min-width: 220px;
            text-align: center;
            font-size: 1.4em;
            color: #ffffff;
            margin: 0;
            text-transform: capitalize;
        }

        .calendar-page {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 18px;
            align-items: start;
        }

        .calendar-page.side-panel-collapsed {
            grid-template-columns: minmax(0, 1fr);
        }

        .calendar-page.side-panel-collapsed #calendar-side-panel {
            display: none;
        }

        .calendar-board {
            min-width: 0;
        }

        .calendar-weekdays,
        .calendar-grid,
        .calendar-week-days,
        .todo-period-layer {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .calendar-weekdays {
            gap: 1px;
            margin-bottom: 1px;
            color: #bdbdbd;
            font-size: 0.85em;
            text-align: center;
        }

        .calendar-weekday {
            padding: 8px 4px;
            background: #181818;
            border: 1px solid #262626;
        }

        .calendar-grid {
            gap: 1px;
            background: #262626;
            border: 1px solid #262626;
        }

        .calendar-grid.month-view,
        .calendar-grid.week-view {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .calendar-grid.day-view {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
        }

        .calendar-week-row {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: #262626;
        }

        .calendar-week-days {
            gap: 1px;
        }

        .todo-period-layer {
            gap: 1px;
            background: #181818;
            padding: 2px 0 3px;
        }

        .todo-period-layer:empty {
            display: none;
        }

        .todo-period-bar {
            min-height: 18px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left-width: 4px;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.76em;
            line-height: 1.25;
            color: #f2f2f2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
            cursor: pointer;
        }

        .todo-period-bar.completed {
            opacity: 0.55;
            text-decoration: line-through;
        }

        .calendar-day {
            min-height: 118px;
            background: #1a1a1a;
            padding: 8px;
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
        }

        .calendar-day.week-day {
            min-height: 240px;
        }

        .calendar-day.single-day {
            min-height: 460px;
        }

        .calendar-day.outside-month {
            background: #151515;
            color: #777777;
        }

        .calendar-day.today {
            box-shadow: inset 0 0 0 2px #6aa0ff;
        }

        .calendar-day.selected,
        .calendar-day.selected-day {
            background: #20271d;
            box-shadow: inset 0 0 0 2px #f2c94c;
        }

        .calendar-day.today.selected,
        .calendar-day.today.selected-day {
            box-shadow: inset 0 0 0 2px #6aa0ff, inset 0 0 0 4px #f2c94c;
        }

        .calendar-day-number {
            font-size: 0.85em;
            color: #cccccc;
            margin-bottom: 6px;
        }

        .calendar-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .calendar-item {
            border-radius: 5px;
            padding: 5px 6px;
            font-size: 0.82em;
            line-height: 1.25;
            overflow-wrap: anywhere;
            border: 1px solid transparent;
        }

        .calendar-item.manual {
            background: #263238;
            border-color: #3f5861;
        }

        .calendar-item.todo {
            background: #2d2417;
            border-color: #76562b;
            cursor: pointer;
        }

        .calendar-item.todo.todo-period {
            background: #222615;
            border-color: #667332;
        }

        .day-period-section {
            background: #181818;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 10px;
        }

        .day-period-section h2 {
            margin: 0 0 8px;
            font-size: 1em;
            color: #ffffff;
        }

        .day-period-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .day-period-item {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-left-width: 4px;
            border-radius: 5px;
            padding: 6px 8px;
            background: #202020;
            font-size: 0.86em;
            line-height: 1.35;
            cursor: pointer;
        }

        .day-period-item.completed {
            opacity: 0.58;
            text-decoration: line-through;
        }

        .day-period-meta {
            display: block;
            margin-top: 3px;
            color: #bbbbbb;
            font-size: 0.9em;
        }

        .todo-category-badge {
            display: inline-block;
            border-radius: 4px;
            padding: 1px 4px;
            margin-right: 4px;
            color: #ffffff;
            font-size: 0.85em;
            line-height: 1.2;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
        }

        .calendar-item.completed {
            opacity: 0.62;
            text-decoration: line-through;
        }

        .calendar-item-time {
            color: #a8d6e8;
            font-weight: 600;
            margin-right: 4px;
        }

        .calendar-item-source {
            color: #bbbbbb;
            font-weight: 600;
            margin-right: 4px;
        }

        .calendar-item-notes {
            display: block;
            color: #cccccc;
            margin-top: 3px;
            white-space: pre-wrap;
        }

        .delete-event-btn {
            display: block;
            margin: 5px 0 0;
            padding: 3px 6px;
            font-size: 0.78em;
            background: #3a2424;
        }

        .delete-event-btn:hover {
            background: #513030;
        }

        .side-section {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .side-section h2 {
            font-size: 1.1em;
            margin: 0 0 12px;
            color: #ffffff;
        }

        .todo-only-fields.hidden,
        .calendar-only-fields.hidden {
            display: none;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1 1 140px;
            min-height: 40px;
        }

        .sr-only {
            position: absolute !important;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 1px, 1px);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 900px) {
            .calendar-page {
                grid-template-columns: 1fr;
            }

            .calendar-day {
                min-height: 98px;
                padding: 6px;
            }
        }

        @media (max-width: 620px) {
            body {
                padding: 14px;
            }

            .calendar-toolbar {
                gap: 8px;
            }

            #calendar-month-label {
                min-width: 0;
                flex: 1;
                font-size: 1.05em;
            }

            .calendar-period-nav {
                flex-basis: 100%;
                min-width: 0;
            }

            .calendar-weekday {
                font-size: 0.78em;
                padding: 6px 2px;
            }

            .calendar-day {
                min-height: 86px;
                padding: 5px;
            }

            .calendar-item {
                font-size: 0.74em;
                padding: 4px;
            }

            .todo-modal-grid {
                grid-template-columns: 1fr;
            }

            .modal-subtask-add {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>

<body>
    <nav class="top-tabs" aria-label="Navigation projet">
        <a class="top-tab" id="todo-tab-link" href="todo.html">Todo</a>
        <a class="top-tab active" id="calendar-tab-link" href="calendrier.html" aria-current="page">Calendrier</a>
    </nav>

    <div id="cloud-status" aria-live="polite">Cloud: non initialisé</div>

    <div id="key-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="key-modal-title">
        <div class="modal">
            <h3 id="key-modal-title">Charger un projet</h3>
            <p>Entrez la clé du projet (UUID v4) :</p>
            <input type="text" id="key-input" placeholder="xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx" autocomplete="off"
                spellcheck="false">
            <div id="key-error" class="error">Clé invalide. Format attendu : UUID v4.</div>
            <div class="actions">
                <button id="key-cancel" type="button">Annuler</button>
                <button id="key-confirm" type="button">Valider</button>
            </div>
        </div>
    </div>

    <div id="todo-task-modal" class="modal-backdrop" role="dialog" aria-modal="true"
        aria-labelledby="todo-task-modal-title">
        <div class="modal todo-task-modal">
            <div class="modal-header">
                <h3 id="todo-task-modal-title">Tâche Todo</h3>
                <button id="todo-modal-close-x" class="modal-close-btn" type="button" aria-label="Fermer">×</button>
            </div>

            <div id="todo-modal-status" class="modal-status" aria-live="polite"></div>

            <form id="todo-task-modal-form">
                <label class="todo-modal-check" for="todo-modal-completed">
                    <input id="todo-modal-completed" name="todo-modal-completed" type="checkbox">
                    Tâche terminée
                </label>

                <div class="todo-modal-grid">
                    <div class="todo-modal-full">
                        <label for="todo-modal-title-input">Titre</label>
                        <input id="todo-modal-title-input" name="todo-modal-title" type="text" autocomplete="off">
                    </div>

                    <div class="todo-modal-full">
                        <label for="todo-modal-description">Description</label>
                        <textarea id="todo-modal-description" name="todo-modal-description"></textarea>
                    </div>

                    <div>
                        <label for="todo-modal-category">Catégorie</label>
                        <select id="todo-modal-category" name="todo-modal-category"></select>
                    </div>

                    <div>
                        <label for="todo-modal-priority">Priorité</label>
                        <select id="todo-modal-priority" name="todo-modal-priority">
                            <option value="low">Basse</option>
                            <option value="medium">Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>

                    <div class="todo-modal-full">
                        <label for="todo-modal-due-date">Date d'échéance</label>
                        <input id="todo-modal-due-date" name="todo-modal-due-date" type="date">
                    </div>

                    <div class="todo-modal-full">
                        <label>Sous-tâches</label>
                        <div id="todo-modal-subtasks" class="todo-modal-subtasks"></div>
                        <div class="modal-subtask-add">
                            <input id="todo-modal-new-subtask" name="todo-modal-new-subtask" type="text"
                                placeholder="Nouvelle sous-tâche" autocomplete="off">
                            <button id="todo-modal-add-subtask" type="button">Ajouter</button>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button id="todo-modal-close" type="button">Fermer</button>
                    <button id="todo-modal-save" type="submit">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="calendar-header">
        <label for="calendar-title-input" id="calendar-title-label">Nom du calendrier :</label>
        <input id="calendar-title-input" name="calendar-title" type="text" placeholder="Calendrier"
            aria-label="Nom du calendrier" autocomplete="off">
    </div>

    <div class="calendar-toolbar" aria-label="Navigation calendrier">
        <div class="view-switcher" role="group" aria-label="Choisir la vue du calendrier">
            <button class="view-mode-btn" type="button" data-mode="day" aria-pressed="false">Jour</button>
            <button class="view-mode-btn" type="button" data-mode="week" aria-pressed="false">Semaine</button>
            <button class="view-mode-btn active" type="button" data-mode="month" aria-pressed="true">Mois</button>
        </div>
        <div class="calendar-period-nav" aria-label="Navigation de période">
            <button id="prev-period-btn" type="button">Mois précédent</button>
            <h1 id="calendar-month-label">Calendrier</h1>
            <button id="next-period-btn" type="button">Mois suivant</button>
        </div>
        <div class="calendar-toolbar-actions">
            <button id="today-btn" type="button">Aujourd'hui</button>
            <button id="toggle-todo-periods-btn" type="button" aria-pressed="false">Afficher les périodes Todo</button>
            <button id="toggle-side-panel-btn" type="button">Masquer le panneau</button>
        </div>
    </div>

    <div class="calendar-page" id="calendar-page">
        <main class="calendar-board" aria-label="Calendrier mensuel">
            <div class="calendar-weekdays" aria-hidden="true">
                <div class="calendar-weekday">Lun</div>
                <div class="calendar-weekday">Mar</div>
                <div class="calendar-weekday">Mer</div>
                <div class="calendar-weekday">Jeu</div>
                <div class="calendar-weekday">Ven</div>
                <div class="calendar-weekday">Sam</div>
                <div class="calendar-weekday">Dim</div>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
        </main>

        <aside id="calendar-side-panel">
            <section class="side-section" aria-labelledby="add-event-title">
                <h2 id="add-event-title">Ajouter un événement</h2>
                <form id="event-form">
                    <label for="event-kind">Type</label>
                    <select id="event-kind" name="event-kind">
                        <option value="calendar">Événement calendrier</option>
                        <option value="todo">Tâche Todo</option>
                    </select>

                    <label for="event-title">Titre</label>
                    <input id="event-title" name="event-title" type="text" required autocomplete="off">

                    <label for="event-date">Date</label>
                    <input id="event-date" name="event-date" type="date" required>

                    <div class="calendar-only-fields" id="calendar-only-fields">
                        <label for="event-time">Heure optionnelle</label>
                        <input id="event-time" name="event-time" type="time">
                    </div>

                    <div class="todo-only-fields hidden" id="todo-only-fields">
                        <label for="todo-category">Catégorie Todo</label>
                        <select id="todo-category" name="todo-category"></select>

                        <label for="todo-priority">Priorité Todo</label>
                        <select id="todo-priority" name="todo-priority">
                            <option value="low">Basse</option>
                            <option value="medium" selected>Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>

                    <label for="event-notes">Notes optionnelles</label>
                    <textarea id="event-notes" name="event-notes"></textarea>

                    <button id="event-submit-btn" type="submit">Ajouter événement</button>
                </form>
            </section>

            <section class="side-section" aria-labelledby="sync-title">
                <h2 id="sync-title">Sauvegarde &amp; Restauration calendrier</h2>
                <label for="calendar-sync-box" class="sr-only">JSON du calendrier</label>
                <textarea id="calendar-sync-box" name="calendar-sync-json" aria-label="Zone JSON du calendrier"
                    placeholder="Copier ou coller ici le JSON du calendrier..."></textarea>
                <div class="action-buttons">
                    <button id="copy-calendar-btn" type="button">Copier JSON</button>
                    <button id="reload-calendar-btn" type="button">Recharger cloud</button>
                </div>
            </section>
        </aside>
    </div>

    <textarea id="calendar-sync-data" style="display:none;"></textarea>

    <script>
        let calendarTitle = 'Calendrier';
        let calendarEvents = [];
        let calendarView = {
            mode: 'month',
            year: new Date().getFullYear(),
            month: new Date().getMonth(),
            selectedDate: calendarYmd(new Date())
        };
        let calendarSectionStates = {};
        let calendarTodoItems = [];
        let calendarTodoCategories = [{ name: 'Général', color: '#ffffff' }];
        let calendarTodoState = {};
        let calendarModalTodoTaskId = null;
        let calendarModalTodoTask = null;
        let calendarCanUseLocalStorage = false;
        let calendarAutosaveTimer = null;

        function calendarYmd(date) {
