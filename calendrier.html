        function calendarCombinedItemsByDate() {
            const byDate = {};
            calendarEvents.forEach(function (event) {
                const date = calendarNormalizeDateValue(event.date);
                if (!date) return;
                if (!byDate[date]) byDate[date] = [];
                byDate[date].push({
                    source: 'calendar',
                    id: event.id,
                    title: event.title || 'Evénement sans titre',
                    date: date,
                    time: event.time || '',
                    notes: event.notes || '',
                    type: 'manual'
                });
            });
            calendarTodoItems.forEach(function (item) {
                const dueDate = calendarNormalizeDateValue(item && item.date);
                if (!dueDate) return;

                if (calendarSectionStates.showTodoPeriods && calendarGetTodoPeriodRange(item)) {
                    return;
                }

                calendarAddItemToDateMap(byDate, dueDate, item);
            });
            Object.keys(byDate).forEach(function (date) {
                byDate[date].sort(function (a, b) {
                    if (a.source !== b.source) return a.source === 'calendar' ? -1 : 1;
                    return String(a.time || '').localeCompare(String(b.time || ''));
                });
            });
            return byDate;
        }

        function calendarAddItemToDateMap(byDate, date, item) {
            if (!byDate[date]) byDate[date] = [];
            byDate[date].push(item);
        }

        function getTodayYmd() {
            return calendarYmd(new Date());
        }

        function calendarCompareYmd(a, b) {
            const first = calendarNormalizeDateValue(a);
            const second = calendarNormalizeDateValue(b);
            if (!first || !second) return 0;
            if (first < second) return -1;
            if (first > second) return 1;
            return 0;
        }

        function calendarMaxYmd(a, b) {
            return calendarCompareYmd(a, b) >= 0 ? calendarNormalizeDateValue(a) : calendarNormalizeDateValue(b);
        }

        function calendarMinYmd(a, b) {
            return calendarCompareYmd(a, b) <= 0 ? calendarNormalizeDateValue(a) : calendarNormalizeDateValue(b);
        }

        function calendarYmdToUtcTime(ymd) {
            const parts = String(ymd || '').split('-');
            if (parts.length !== 3) return 0;
            return Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        }

        function calendarDaysBetween(startYmd, endYmd) {
            const start = calendarYmdToUtcTime(calendarNormalizeDateValue(startYmd));
            const end = calendarYmdToUtcTime(calendarNormalizeDateValue(endYmd));
            return Math.round((end - start) / 86400000);
        }

        function calendarGetTodoPeriodRange(todoItem) {
            const dueDate = calendarNormalizeDateValue(todoItem && (todoItem.dueDate || todoItem.date));
            const today = getTodayYmd();
            if (!dueDate || calendarCompareYmd(dueDate, today) < 0) return null;

            let startDate = calendarNormalizeDateValue(todoItem && todoItem.startDate) || today;
            if (calendarCompareYmd(startDate, dueDate) > 0) {
                startDate = dueDate;
            }

            return { startDate, dueDate };
        }

        function getTodoPeriodItems() {
            if (calendarSectionStates.showTodoPeriods !== true) return [];

            return calendarTodoItems.map(function (item) {
                const range = calendarGetTodoPeriodRange(item);
                if (!range) return null;
                const category = item.category || 'Général';
                return Object.assign({}, item, {
                    source: 'todo',
                    startDate: range.startDate,
                    dueDate: range.dueDate,
                    date: range.dueDate,
                    category: category,
                    categoryColor: item.categoryColor || calendarGetTodoCategoryColor(category)
                });
            }).filter(Boolean).sort(function (a, b) {
                const startCmp = calendarCompareYmd(a.startDate, b.startDate);
                if (startCmp !== 0) return startCmp;
                return calendarCompareYmd(a.dueDate, b.dueDate);
            });
        }

        function calendarRender() {
            const grid = document.getElementById('calendar-grid');
            const label = document.getElementById('calendar-month-label');
            if (!grid || !label) return;

            if (!calendarIsValidViewMode(calendarView.mode)) {
                calendarView.mode = 'month';
            }
            setSelectedDate(getSelectedDate());

            grid.innerHTML = '';
            grid.className = 'calendar-grid';
            const byDate = calendarCombinedItemsByDate();

            calendarApplySidePanelState();
            calendarUpdateViewControls();

            if (calendarView.mode === 'day') {
                renderDayView(grid, label, byDate);
            } else if (calendarView.mode === 'week') {
                renderWeekView(grid, label, byDate);
            } else {
                renderMonthView(grid, label, byDate);
            }
        }

        function renderMonthView(grid, label, byDate) {
            const selected = calendarSelectedDateObject();
            const year = selected.getFullYear();
            const month = selected.getMonth();
            calendarView.year = year;
            calendarView.month = month;
            label.textContent = calendarFormatMonth(year, month);
            calendarSetWeekdaysVisible(true);
            grid.classList.add('month-view');

            const firstDay = new Date(year, month, 1);
            const mondayOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const weeks = [];
            const periodItems = getTodoPeriodItems();

            for (let i = 0; i < 42; i++) {
                let cellYear = year;
                let cellMonth = month;
                let dayNumber = i - mondayOffset + 1;
                let outsideMonth = false;

                if (dayNumber < 1) {
                    cellMonth = month - 1;
                    if (cellMonth < 0) {
                        cellMonth = 11;
                        cellYear = year - 1;
                    }
                    dayNumber = daysInPrevMonth + dayNumber;
                    outsideMonth = true;
                } else if (dayNumber > daysInMonth) {
                    dayNumber = dayNumber - daysInMonth;
                    cellMonth = month + 1;
                    if (cellMonth > 11) {
                        cellMonth = 0;
                        cellYear = year + 1;
                    }
                    outsideMonth = true;
                }

                if (!weeks[Math.floor(i / 7)]) {
                    weeks[Math.floor(i / 7)] = [];
                }
                weeks[Math.floor(i / 7)].push({
                    dateObj: new Date(cellYear, cellMonth, dayNumber),
                    label: String(dayNumber),
                    outsideMonth: outsideMonth
                });
            }

            weeks.forEach(function (weekDays) {
                const weekRow = document.createElement('div');
                weekRow.className = 'calendar-week-row';

                const daysRow = document.createElement('div');
                daysRow.className = 'calendar-week-days';
                weekDays.forEach(function (day) {
                    daysRow.appendChild(calendarCreateDayCell(day.dateObj, byDate, {
                        label: day.label,
                        outsideMonth: day.outsideMonth
                    }));
                });
                weekRow.appendChild(daysRow);

                if (calendarSectionStates.showTodoPeriods) {
                    weekRow.appendChild(renderTodoPeriodBarsForMonth(
                        calendarYmd(weekDays[0].dateObj),
                        calendarYmd(weekDays[6].dateObj),
                        periodItems
                    ));
                }

                grid.appendChild(weekRow);
            });
        }

        function renderWeekView(grid, label, byDate) {
            const selected = calendarSelectedDateObject();
            const weekStart = getWeekStart(selected);
            const weekEnd = calendarAddDays(weekStart, 6);
            label.textContent = calendarFormatWeekRange(weekStart, weekEnd);
            calendarSetWeekdaysVisible(true);
            grid.classList.add('week-view');

            const weekRow = document.createElement('div');
            weekRow.className = 'calendar-week-row';
            const daysRow = document.createElement('div');
            daysRow.className = 'calendar-week-days';

            for (let i = 0; i < 7; i++) {
                const date = calendarAddDays(weekStart, i);
                daysRow.appendChild(calendarCreateDayCell(date, byDate, {
                    label: calendarFormatWeekDayLabel(date),
                    extraClass: 'week-day'
                }));
            }
            weekRow.appendChild(daysRow);

            if (calendarSectionStates.showTodoPeriods) {
                weekRow.appendChild(renderTodoPeriodBarsForWeek(
                    calendarYmd(weekStart),
                    calendarYmd(weekEnd),
                    getTodoPeriodItems()
                ));
            }

            grid.appendChild(weekRow);
        }

        function renderDayView(grid, label, byDate) {
            const selected = calendarSelectedDateObject();
            const selectedYmd = calendarYmd(selected);
            label.textContent = calendarFormatLongDate(selected);
            calendarSetWeekdaysVisible(false);
            grid.classList.add('day-view');
            grid.appendChild(calendarCreateDayCell(selected, byDate, {
                label: calendarFormatLongDate(selected),
                extraClass: 'single-day'
            }));

            if (calendarSectionStates.showTodoPeriods) {
                const periodSection = renderTodoPeriodsForDay(selectedYmd);
                if (periodSection) {
                    grid.appendChild(periodSection);
                }
            }
        }

        function renderTodoPeriodBarsForMonth(rangeStartYmd, rangeEndYmd, periodItems) {
            return calendarCreateTodoPeriodLayer(rangeStartYmd, rangeEndYmd, periodItems);
        }

        function renderTodoPeriodBarsForWeek(rangeStartYmd, rangeEndYmd, periodItems) {
            return calendarCreateTodoPeriodLayer(rangeStartYmd, rangeEndYmd, periodItems);
        }

        function calendarCreateTodoPeriodLayer(rangeStartYmd, rangeEndYmd, periodItems) {
            const layer = document.createElement('div');
            layer.className = 'todo-period-layer';

            periodItems.forEach(function (period) {
                const segmentStart = calendarMaxYmd(period.startDate, rangeStartYmd);
                const segmentEnd = calendarMinYmd(period.dueDate, rangeEndYmd);
                if (calendarCompareYmd(segmentStart, segmentEnd) > 0) return;
                layer.appendChild(calendarCreateTodoPeriodBar(period, segmentStart, segmentEnd, rangeStartYmd));
            });

            return layer;
        }

        function calendarCreateTodoPeriodBar(period, segmentStartYmd, segmentEndYmd, rangeStartYmd) {
            const bar = document.createElement('div');
            const color = calendarNormalizeColor(period.categoryColor) || calendarGetTodoCategoryColor(period.category);
            const startOffset = Math.max(0, calendarDaysBetween(rangeStartYmd, segmentStartYmd));
            const span = Math.max(1, calendarDaysBetween(segmentStartYmd, segmentEndYmd) + 1);

            bar.className = 'todo-period-bar';
            if (period.completed) bar.classList.add('completed');
            bar.style.gridColumn = `${startOffset + 1} / span ${span}`;
            bar.style.backgroundColor = calendarHexToRgba(color, 0.28);
            bar.style.borderColor = calendarHexToRgba(color, 0.62);
            bar.style.borderLeftColor = color;
            bar.textContent = period.title || 'Tâche Todo';
            bar.title = calendarTodoPeriodTooltip(period);
            calendarMakeTodoElementInteractive(bar, period.id);
            return bar;
        }

        function renderTodoPeriodsForDay(selectedYmd) {
            const activePeriods = getTodoPeriodItems().filter(function (period) {
                return calendarCompareYmd(period.startDate, selectedYmd) <= 0 && calendarCompareYmd(selectedYmd, period.dueDate) <= 0;
            });
            if (!activePeriods.length) return null;

            const section = document.createElement('section');
            section.className = 'day-period-section';

            const title = document.createElement('h2');
            title.textContent = 'Périodes Todo actives ce jour';
            section.appendChild(title);

            const list = document.createElement('div');
            list.className = 'day-period-list';
            activePeriods.forEach(function (period) {
                const color = calendarNormalizeColor(period.categoryColor) || calendarGetTodoCategoryColor(period.category);
                const item = document.createElement('div');
                item.className = 'day-period-item';
                if (period.completed) item.classList.add('completed');
                item.style.borderLeftColor = color;
                item.title = calendarTodoPeriodTooltip(period);
                calendarMakeTodoElementInteractive(item, period.id);

                const source = document.createElement('span');
                source.className = 'calendar-item-source';
                source.textContent = '[Todo]';
                item.appendChild(source);

                const category = document.createElement('span');
                category.className = 'todo-category-badge';
                category.textContent = period.category || 'Général';
                category.style.backgroundColor = color;
                item.appendChild(category);

                const text = document.createElement('span');
                text.textContent = period.completed ? `Terminé: ${period.title}` : period.title;
                item.appendChild(text);

                const meta = document.createElement('span');
                meta.className = 'day-period-meta';
                meta.textContent = calendarCompareYmd(selectedYmd, period.dueDate) === 0
                    ? `Échéance aujourd'hui (${calendarYmdToDisplayDate(period.dueDate)})`
                    : `Échéance le ${calendarYmdToDisplayDate(period.dueDate)}`;
                item.appendChild(meta);

                list.appendChild(item);
            });
            section.appendChild(list);
            return section;
        }

        function calendarTodoPeriodTooltip(period) {
            const category = period.category || 'Général';
            return `${period.title || 'Tâche Todo'} - ${category} - échéance le ${calendarYmdToDisplayDate(period.dueDate)}`;
        }

        function calendarHexToRgba(color, alpha) {
            const normalized = calendarNormalizeColor(color) || '#ffffff';
            const r = parseInt(normalized.slice(1, 3), 16);
            const g = parseInt(normalized.slice(3, 5), 16);
            const b = parseInt(normalized.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function calendarCreateDayCell(dateObj, byDate, options) {
            options = options || {};
            const cellDate = calendarYmd(dateObj);
            const dayCell = document.createElement('div');
            dayCell.className = 'calendar-day';
            if (options.extraClass) dayCell.classList.add(options.extraClass);
            if (options.outsideMonth) dayCell.classList.add('outside-month');
            if (cellDate === calendarYmd(new Date())) dayCell.classList.add('today');
            if (cellDate === getSelectedDate()) {
                dayCell.classList.add('selected');
                dayCell.classList.add('selected-day');
            }
            dayCell.addEventListener('click', function () {
                if (calendarDayClickTimer) clearTimeout(calendarDayClickTimer);
                calendarDayClickTimer = setTimeout(function () {
                    setSelectedDate(cellDate);
                    calendarSaveData();
                    calendarRender();
                    calendarDayClickTimer = null;
                }, 180);
            });
            dayCell.addEventListener('dblclick', function () {
                if (calendarDayClickTimer) {
                    clearTimeout(calendarDayClickTimer);
                    calendarDayClickTimer = null;
                }
                setSelectedDate(cellDate);
                changeView('day');
            });

            const number = document.createElement('div');
            number.className = 'calendar-day-number';
            number.textContent = options.label || String(dateObj.getDate());
            dayCell.appendChild(number);

            const items = document.createElement('div');
            items.className = 'calendar-items';
            (byDate[cellDate] || []).forEach(function (item) {
                items.appendChild(calendarCreateItemElement(item));
            });
            dayCell.appendChild(items);
            return dayCell;
        }

        function calendarUpdateViewControls() {
            document.querySelectorAll('.view-mode-btn').forEach(function (button) {
                const active = button.getAttribute('data-mode') === calendarView.mode;
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
            const periodsBtn = document.getElementById('toggle-todo-periods-btn');
            if (periodsBtn) {
                const enabled = calendarSectionStates.showTodoPeriods === true;
                periodsBtn.classList.toggle('active', enabled);
                periodsBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
                periodsBtn.textContent = enabled ? 'Masquer les périodes Todo' : 'Afficher les périodes Todo';
            }

            const prevBtn = document.getElementById('prev-period-btn');
            const nextBtn = document.getElementById('next-period-btn');
            if (calendarView.mode === 'day') {
                if (prevBtn) prevBtn.textContent = 'Jour précédent';
                if (nextBtn) nextBtn.textContent = 'Jour suivant';
            } else if (calendarView.mode === 'week') {
                if (prevBtn) prevBtn.textContent = 'Semaine précédente';
                if (nextBtn) nextBtn.textContent = 'Semaine suivante';
            } else {
                if (prevBtn) prevBtn.textContent = 'Mois précédent';
                if (nextBtn) nextBtn.textContent = 'Mois suivant';
            }
        }

        function calendarSetWeekdaysVisible(visible) {
            const weekdays = document.querySelector('.calendar-weekdays');
            if (weekdays) {
                weekdays.style.display = visible ? 'grid' : 'none';
            }
        }

        function calendarApplySidePanelState() {
            const page = document.getElementById('calendar-page');
            const toggleBtn = document.getElementById('toggle-side-panel-btn');
            const open = calendarSectionStates.sidePanelOpen !== false;
            if (page) page.classList.toggle('side-panel-collapsed', !open);
            if (toggleBtn) toggleBtn.textContent = open ? 'Masquer le panneau' : 'Afficher le panneau';
        }

        function calendarMakeTodoElementInteractive(el, taskId) {
            if (!el || taskId === undefined || taskId === null) return;
            el.setAttribute('role', 'button');
            el.setAttribute('tabindex', '0');
            el.setAttribute('aria-label', 'Ouvrir la tâche Todo');
            el.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                openTodoTaskModal(taskId);
            });
            el.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    e.stopPropagation();
                    openTodoTaskModal(taskId);
                }
            });
        }

        function calendarSetTodoModalStatus(text, cls) {
            const status = document.getElementById('todo-modal-status');
            if (!status) return;
            status.textContent = text || '';
            status.classList.remove('ok', 'err');
            if (cls) status.classList.add(cls);
        }

        function calendarClonePlain(value) {
            try {
                return JSON.parse(JSON.stringify(value || {}));
            } catch (_) {
                return Object.assign({}, value || {});
            }
        }

        function calendarNormalizeSubtasksForModal(subtasks) {
            if (!Array.isArray(subtasks)) return [];
            return subtasks.filter(Boolean).map(function (subtask) {
                return Object.assign({}, calendarClonePlain(subtask), {
                    title: String(subtask.title || '').trim() || 'Sous-tâche sans titre',
                    completed: !!subtask.completed
                });
            });
        }

        function calendarNormalizeTodoTaskForModal(task) {
            const normalized = calendarClonePlain(task);
            normalized.id = task.id;
            normalized.title = String(task.title || '').trim() || 'Tâche sans titre';
            normalized.priority = ['low', 'medium', 'high'].indexOf(task.priority) >= 0 ? task.priority : 'medium';
            normalized.category = task.category || 'Général';
            normalized.completed = !!task.completed;
            normalized.completionDate = task.completionDate || null;
            normalized.description = String(task.description || '');
            normalized.subtasks = calendarNormalizeSubtasksForModal(task.subtasks);
            normalized.dueDate = task.dueDate || '';
            normalized.dueDateDisplay = task.dueDateDisplay || '';
            if (typeof normalized.expanded !== 'boolean') normalized.expanded = false;
            return normalized;
        }

        function getTodoTaskById(taskId) {
            const tasks = calendarTodoState && Array.isArray(calendarTodoState.tasks) ? calendarTodoState.tasks : [];
            return tasks.find(function (task) {
                return String(task && task.id) === String(taskId);
            }) || null;
        }

        async function openTodoTaskModal(taskId) {
            calendarModalTodoTaskId = String(taskId);
            const modal = document.getElementById('todo-task-modal');
            const form = document.getElementById('todo-task-modal-form');
            if (!modal || !form) return;

            modal.style.display = 'flex';
            form.style.display = 'none';
            calendarSetTodoModalStatus('Chargement de la tâche...', '');

            if (calendarTodoDocRef || calendarInitFirebase()) {
                try {
                    const snap = await calendarTodoDocRef.get();
                    if (snap.exists) {
                        calendarApplyTodoSnapshot(snap.data());
                    }
                } catch (e) {
                    console.warn('Lecture Todo avant ouverture modale échouée :', e);
                    calendarSetTodoModalStatus('Lecture Firestore échouée, affichage des données en mémoire.', 'err');
                }
            } else {
                calendarSetTodoModalStatus('Firestore indisponible : modification impossible pour cette tâche.', 'err');
            }

            const task = getTodoTaskById(taskId);
            if (!task) {
                form.style.display = 'none';
                calendarSetTodoModalStatus('Tâche introuvable.', 'err');
                return;
            }

            renderTodoTaskModal(task);
        }

        function closeTodoTaskModal() {
            const modal = document.getElementById('todo-task-modal');
            if (modal) modal.style.display = 'none';
            calendarModalTodoTaskId = null;
            calendarModalTodoTask = null;
            calendarSetTodoModalStatus('', '');
        }

        function renderTodoTaskModal(task) {
            calendarModalTodoTask = calendarNormalizeTodoTaskForModal(task);
            calendarModalTodoTaskId = String(calendarModalTodoTask.id);

            const form = document.getElementById('todo-task-modal-form');
            const titleInput = document.getElementById('todo-modal-title-input');
            const completedInput = document.getElementById('todo-modal-completed');
            const descriptionInput = document.getElementById('todo-modal-description');
            const priorityInput = document.getElementById('todo-modal-priority');
            const dueDateInput = document.getElementById('todo-modal-due-date');

            if (form) form.style.display = 'block';
            if (titleInput) titleInput.value = calendarModalTodoTask.title;
            if (completedInput) completedInput.checked = !!calendarModalTodoTask.completed;
            if (descriptionInput) descriptionInput.value = calendarModalTodoTask.description || '';
            if (priorityInput) priorityInput.value = calendarModalTodoTask.priority || 'medium';
            if (dueDateInput) dueDateInput.value = calendarNormalizeDateValue(calendarModalTodoTask.dueDate) || '';

            calendarRenderTodoModalCategoryOptions();
            renderModalSubtasks();
            calendarSetTodoModalStatus('', '');
        }

        function calendarRenderTodoModalCategoryOptions() {
            const select = document.getElementById('todo-modal-category');
            if (!select) return;

            const currentValue = calendarModalTodoTask
                ? calendarModalTodoTask.category || 'Général'
                : select.value || 'Général';
            const categories = calendarTodoCategories.length ? calendarTodoCategories : [{ name: 'Général', color: '#ffffff' }];

            select.innerHTML = '';
            categories.forEach(function (category) {
                const option = document.createElement('option');
                option.value = category.name;
                option.textContent = category.name;
                select.appendChild(option);
            });
            if (!categories.some(function (category) { return category.name === currentValue; })) {
                const option = document.createElement('option');
                option.value = currentValue;
                option.textContent = currentValue;
                select.appendChild(option);
            }
            select.value = currentValue || categories[0].name;
        }

        function renderModalSubtasks() {
            const container = document.getElementById('todo-modal-subtasks');
            if (!container || !calendarModalTodoTask) return;
            container.innerHTML = '';

            calendarModalTodoTask.subtasks.forEach(function (subtask, index) {
                const row = document.createElement('div');
                row.className = 'modal-subtask-row';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !!subtask.completed;
                checkbox.setAttribute('aria-label', 'Sous-tâche terminée');
                checkbox.addEventListener('change', function () {
                    toggleModalSubtask(index, checkbox.checked);
                });

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.value = subtask.title || '';
                titleInput.setAttribute('aria-label', 'Titre de la sous-tâche');
                titleInput.addEventListener('input', function () {
                    calendarUpdateModalSubtaskTitle(index, titleInput.value);
                });

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'modal-subtask-remove';
                removeBtn.textContent = 'Supprimer';
                removeBtn.addEventListener('click', function () {
                    calendarRemoveModalSubtask(index);
                });

                row.appendChild(checkbox);
                row.appendChild(titleInput);
                row.appendChild(removeBtn);
                container.appendChild(row);
            });
        }

        function addModalSubtask() {
            if (!calendarModalTodoTask) return;
            const input = document.getElementById('todo-modal-new-subtask');
            const title = input ? input.value.trim() : '';
            if (!title) return;

            calendarModalTodoTask.subtasks.push({
                title: title,
                completed: false
            });
            if (input) input.value = '';
            renderModalSubtasks();
            saveTodoTaskFromModal({ silent: true });
        }

        function toggleModalSubtask(index, completed) {
            if (!calendarModalTodoTask || !calendarModalTodoTask.subtasks[index]) return;
            calendarModalTodoTask.subtasks[index].completed = !!completed;
            saveTodoTaskFromModal({ silent: true });
        }

        function calendarUpdateModalSubtaskTitle(index, value) {
            if (!calendarModalTodoTask || !calendarModalTodoTask.subtasks[index]) return;
            calendarModalTodoTask.subtasks[index].title = String(value || '').trim();
        }

        function calendarRemoveModalSubtask(index) {
            if (!calendarModalTodoTask || !calendarModalTodoTask.subtasks[index]) return;
            calendarModalTodoTask.subtasks.splice(index, 1);
            renderModalSubtasks();
            saveTodoTaskFromModal({ silent: true });
        }

        function calendarCollectTodoTaskFromModal() {
            if (!calendarModalTodoTask) return null;

            const titleInput = document.getElementById('todo-modal-title-input');
            const completedInput = document.getElementById('todo-modal-completed');
            const descriptionInput = document.getElementById('todo-modal-description');
            const categoryInput = document.getElementById('todo-modal-category');
            const priorityInput = document.getElementById('todo-modal-priority');
            const dueDateInput = document.getElementById('todo-modal-due-date');
            const updated = calendarClonePlain(calendarModalTodoTask);
            const wasCompleted = !!calendarModalTodoTask.completed;
            const isCompleted = completedInput ? !!completedInput.checked : !!updated.completed;
            const dueDateYmd = calendarNormalizeDateValue(dueDateInput ? dueDateInput.value : '');

            updated.title = titleInput && titleInput.value.trim() ? titleInput.value.trim() : updated.title;
            updated.description = descriptionInput ? descriptionInput.value : '';
            updated.category = categoryInput ? categoryInput.value : updated.category || 'Général';
            updated.priority = priorityInput ? priorityInput.value : updated.priority || 'medium';
            updated.completed = isCompleted;
            updated.completionDate = isCompleted
                ? (wasCompleted && updated.completionDate ? updated.completionDate : new Date().toISOString())
                : null;
            updated.subtasks = calendarNormalizeSubtasksForModal(updated.subtasks);

            if (dueDateYmd) {
                updated.dueDate = calendarYmdToTodoIso(dueDateYmd);
                updated.dueDateDisplay = calendarYmdToDisplayDate(dueDateYmd);
            } else {
                updated.dueDate = '';
                updated.dueDateDisplay = '';
            }

            return updated;
        }

        async function saveTodoTaskFromModal(options) {
            options = options || {};
            const updatedTask = calendarCollectTodoTaskFromModal();
            if (!updatedTask) return false;

            calendarSetTodoModalStatus(options.silent ? 'Sauvegarde...' : 'Sauvegarde de la tâche...', '');
            const savedTask = await updateTodoTaskInFirestore(updatedTask);
            if (!savedTask) return false;

            calendarModalTodoTask = calendarNormalizeTodoTaskForModal(savedTask);
            calendarModalTodoTaskId = String(savedTask.id);
            if (!options.silent) {
                calendarSetTodoModalStatus('Tâche enregistrée.', 'ok');
            } else {
                calendarSetTodoModalStatus('Tâche mise à jour.', 'ok');
            }
            return true;
        }

        async function updateTodoTaskInFirestore(updatedTask) {
            if (!calendarActiveKey()) {
                calendarSetTodoModalStatus('Impossible de sauvegarder : clé projet absente.', 'err');
                calendarSetCloudStatus('clé requise pour modifier une tâche Todo', 'err', { persist: true });
                return null;
            }
            if (typeof firebase === 'undefined') {
                calendarSetTodoModalStatus('Impossible de sauvegarder : Firestore indisponible.', 'err');
                calendarSetCloudStatus('Firestore indisponible pour modifier une tâche Todo', 'err', { persist: true });
                return null;
            }
            if (!calendarTodoDocRef && !calendarInitFirebase()) {
                calendarSetTodoModalStatus('Impossible de sauvegarder : Firestore non initialisé.', 'err');
                return null;
            }

            try {
                const snap = await calendarTodoDocRef.get();
                if (!snap.exists) {
                    calendarSetTodoModalStatus("Impossible de sauvegarder : document Todo introuvable.", 'err');
                    calendarSetCloudStatus('document Todo introuvable', 'err', { persist: true });
                    return null;
                }

                const docData = snap.data() || {};
                const state = calendarExtractTodoState(docData);
                if (!state || typeof state !== 'object' || !Array.isArray(state.tasks)) {
                    calendarSetTodoModalStatus('Impossible de sauvegarder : état Todo invalide.', 'err');
                    calendarSetCloudStatus('état Todo invalide', 'err', { persist: true });
                    return null;
                }

                const tasks = state.tasks.slice();
                const index = tasks.findIndex(function (task) {
                    return String(task && task.id) === String(updatedTask.id);
                });
                if (index < 0) {
                    calendarSetTodoModalStatus('Impossible de sauvegarder : tâche introuvable.', 'err');
                    return null;
                }

                const savedTask = Object.assign({}, tasks[index], updatedTask);
                savedTask.subtasks = calendarNormalizeSubtasksForModal(savedTask.subtasks);
                tasks[index] = savedTask;

                const nextState = Object.assign({}, state, { tasks: tasks });
                await calendarTodoDocRef.set({
                    state: nextState,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                syncCalendarAfterTodoUpdate(nextState);
                return savedTask;
            } catch (e) {
                console.warn('Modification tâche Todo échouée :', e);
                calendarSetTodoModalStatus('Sauvegarde échouée (' + (e.code || e.message || 'inconnu') + ').', 'err');
                calendarSetCloudStatus('modification Todo échouée (' + (e.code || e.message || 'inconnu') + ')', 'err', { persist: true });
                return null;
            }
        }

        function syncCalendarAfterTodoUpdate(nextTodoState) {
            calendarApplyTodoSnapshot({ state: nextTodoState });
            calendarRender();
        }

        function calendarCreateItemElement(item) {
            const el = document.createElement('div');
            el.className = item.source === 'todo' ? 'calendar-item todo' : 'calendar-item manual';
            if (item.isPeriod) el.classList.add('todo-period');
            if (item.completed) el.classList.add('completed');
            if (item.source === 'todo' && item.categoryColor) {
                el.style.borderLeftColor = item.categoryColor;
                el.style.borderLeftWidth = '4px';
            }
            if (item.source === 'todo') {
                calendarMakeTodoElementInteractive(el, item.id);
            }

            const source = document.createElement('span');
            source.className = 'calendar-item-source';
            source.textContent = item.source === 'todo' ? '[Todo]' : '[Calendrier]';
            el.appendChild(source);

            if (item.source === 'todo' && item.category) {
                const category = document.createElement('span');
                category.className = 'todo-category-badge';
                category.textContent = item.category;
                category.style.backgroundColor = item.categoryColor || calendarGetTodoCategoryColor(item.category);
                el.appendChild(category);
            }

            if (item.time) {
                const time = document.createElement('span');
                time.className = 'calendar-item-time';
                time.textContent = item.time;
                el.appendChild(time);
            }

            const title = document.createElement('span');
            const displayTitle = item.isPeriod ? `Période: ${item.title}` : item.title;
            title.textContent = item.completed ? `Terminé: ${displayTitle}` : displayTitle;
            el.appendChild(title);

            if (item.notes) {
                const notes = document.createElement('span');
                notes.className = 'calendar-item-notes';
                notes.textContent = item.notes;
                el.appendChild(notes);
            }

            if (item.source === 'calendar') {
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'delete-event-btn';
                deleteBtn.textContent = 'Supprimer';
                deleteBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    calendarDeleteEvent(item.id);
                });
                el.appendChild(deleteBtn);
            }

            return el;
        }

        function calendarAddEvent(event) {
            calendarEvents.push({
                id: Date.now(),
                title: event.title,
                date: event.date,
                time: event.time || '',
                notes: event.notes || '',
                source: 'calendar',
                type: 'manual'
            });
            calendarSaveData();
            calendarRender();
        }

        function calendarDeleteEvent(eventId) {
            calendarEvents = calendarEvents.filter(function (event) {
                return String(event.id) !== String(eventId);
            });
            calendarSaveData();
            calendarRender();
        }

        function shiftCurrentPeriod(delta) {
            if (calendarView.mode === 'day') {
                calendarSetSelectedDate(calendarAddDays(calendarSelectedDateObject(), delta));
            } else if (calendarView.mode === 'week') {
                calendarSetSelectedDate(calendarAddDays(calendarSelectedDateObject(), delta * 7));
            } else {
                const next = calendarAddMonths(calendarSelectedDateObject(), delta);
                calendarSetSelectedDate(next);
                calendarView.mode = 'month';
            }
            calendarSaveData();
            calendarRender();
        }

        function calendarShiftPeriod(delta) {
            shiftCurrentPeriod(delta);
        }

        function changeView(mode) {
            if (!calendarIsValidViewMode(mode)) return;
            calendarView.mode = mode;
            setSelectedDate(getSelectedDate());
            calendarSaveData();
            calendarRender();
        }

        function calendarSetViewMode(mode) {
            changeView(mode);
        }

        function calendarGoToday() {
            setSelectedDate(calendarYmd(new Date()));
            calendarSaveData();
            calendarRender();
        }

        function calendarToggleSidePanel() {
            calendarSectionStates.sidePanelOpen = calendarSectionStates.sidePanelOpen === false;
            calendarSaveData();
            calendarApplySidePanelState();
        }

        function calendarToggleTodoPeriods() {
            calendarSectionStates.showTodoPeriods = calendarSectionStates.showTodoPeriods !== true;
            calendarSaveData();
            calendarRender();
        }

        function calendarUpdateFormMode() {
            const kind = document.getElementById('event-kind');
            const calendarFields = document.getElementById('calendar-only-fields');
            const todoFields = document.getElementById('todo-only-fields');
            const submitBtn = document.getElementById('event-submit-btn');
            const isTodo = kind && kind.value === 'todo';
            if (calendarFields) calendarFields.classList.toggle('hidden', isTodo);
            if (todoFields) todoFields.classList.toggle('hidden', !isTodo);
            if (submitBtn) submitBtn.textContent = isTodo ? 'Créer tâche Todo' : 'Ajouter événement';
            if (isTodo) calendarRenderTodoCategoryOptions();
        }

        function syncEventFormDateWithSelection() {
            const dateInput = document.getElementById('event-date');
            if (dateInput) {
                dateInput.value = getSelectedDate();
            }
        }

        function calendarYmdToTodoIso(ymd) {
            const dateObj = calendarDateFromYmd(ymd);
            return dateObj.toISOString();
        }

        function calendarYmdToDisplayDate(ymd) {
            const parts = String(ymd || '').split('-');
            if (parts.length !== 3) return ymd || '';
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        async function calendarCreateTodoTaskFromForm(payload) {
            if (!calendarActiveKey()) {
                alert('Impossible de créer une tâche Todo : clé projet absente.');
                calendarSetCloudStatus('clé requise pour créer une tâche Todo', 'err', { persist: true });
                return false;
            }
            if (typeof firebase === 'undefined') {
                alert('Impossible de créer une tâche Todo : Firestore indisponible.');
                calendarSetCloudStatus('Firestore indisponible pour créer une tâche Todo', 'err', { persist: true });
                return false;
            }
            if (!calendarTodoDocRef && !calendarInitFirebase()) {
                alert('Impossible de créer une tâche Todo : Firestore non initialisé.');
                return false;
            }

            try {
                const snap = await calendarTodoDocRef.get();
                if (!snap.exists) {
                    alert("Impossible de créer une tâche Todo : le document Todo n'existe pas encore.");
                    calendarSetCloudStatus('document Todo introuvable', 'err', { persist: true });
                    return false;
                }

                const docData = snap.data() || {};
                const state = calendarExtractTodoState(docData);
                if (!state || typeof state !== 'object') {
                    alert('Impossible de créer une tâche Todo : état Todo invalide.');
                    calendarSetCloudStatus('état Todo invalide', 'err', { persist: true });
                    return false;
                }

                const tasks = Array.isArray(state.tasks) ? state.tasks.slice() : [];
                const category = payload.category || 'Général';
                const dueDateYmd = calendarNormalizeDateValue(payload.date) || getSelectedDate();
                const newTask = {
                    id: Date.now(),
                    title: payload.title,
                    priority: payload.priority || 'medium',
                    category: category,
                    completed: false,
                    completionDate: null,
                    description: payload.notes || '',
                    subtasks: [],
                    dueDate: calendarYmdToTodoIso(dueDateYmd),
                    dueDateDisplay: calendarYmdToDisplayDate(dueDateYmd),
                    expanded: false
                };

                tasks.push(newTask);
                const nextState = Object.assign({}, state, { tasks: tasks });
                if (!Array.isArray(nextState.categories)) {
                    nextState.categories = calendarTodoCategories.length ? calendarTodoCategories.slice() : [{ name: 'Général', color: '#ffffff' }];
                }

                await calendarTodoDocRef.set({
                    state: nextState,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                calendarSetCloudStatus('tâche Todo créée', 'ok');
                return true;
            } catch (e) {
                console.warn('Création tâche Todo échouée :', e);
                calendarSetCloudStatus('création Todo échouée (' + (e.code || e.message || 'inconnu') + ')', 'err', { persist: true });
                alert('Impossible de créer la tâche Todo dans Firestore.');
                return false;
            }
        }

        function calendarShowKeyModal(force) {
            const modal = document.getElementById('key-modal');
            const input = document.getElementById('key-input');
            const err = document.getElementById('key-error');
            if (!modal || !input || !err) return;
            modal._force = !!force;
            input.value = '';
            err.style.display = 'none';
            modal.style.display = 'flex';
            setTimeout(function () { input.focus(); }, 0);
        }

        function calendarHideKeyModal() {
            const modal = document.getElementById('key-modal');
            if (modal) modal.style.display = 'none';
        }

        function calendarBindKeyModal() {
            const input = document.getElementById('key-input');
            const err = document.getElementById('key-error');
            const cancelBtn = document.getElementById('key-cancel');
            const confirmBtn = document.getElementById('key-confirm');
            const modal = document.getElementById('key-modal');
            if (!input || !err || !cancelBtn || !confirmBtn || !modal) return;

            async function acceptKey() {
                const newKey = String(input.value || '').trim();
                if (!CALENDAR_UUID_V4.test(newKey)) {
                    err.textContent = 'Clé invalide. Format attendu : UUID v4.';
                    err.style.display = 'block';
                    return;
                }

                window.FB_SHARED_KEY = newKey;
                try {
                    localStorage.setItem('FB_SHARED_KEY', newKey);
                    localStorage.setItem(calendarSharedKeyStorageKey(), newKey);
                } catch (_) { }

                calendarUpdateTopTabs();
                calendarLoadData();
                calendarRenderTitle();
                calendarRender();

                if (window._calendarFbUnsub) {
                    try { window._calendarFbUnsub(); } catch (_) { }
                }
                if (window._calendarTodoUnsub) {
                    try { window._calendarTodoUnsub(); } catch (_) { }
                }
                calendarFbDocRef = null;
                calendarTodoDocRef = null;

                if (!calendarInitFirebase()) {
                    err.textContent = "Impossible d'initialiser Firebase pour cette clé.";
                    err.style.display = 'block';
                    return;
                }

                await calendarCloudLoad();
                calendarHideKeyModal();
            }

            confirmBtn.addEventListener('click', acceptKey);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') acceptKey();
            });
            cancelBtn.addEventListener('click', function () {
                if (modal._force) {
                    err.textContent = 'Une clé valide est requise pour continuer.';
                    err.style.display = 'block';
                    return;
                }
                calendarHideKeyModal();
            });
        }

        function calendarBindControls() {
            document.getElementById('prev-period-btn').addEventListener('click', function () {
                calendarShiftPeriod(-1);
            });
            document.getElementById('next-period-btn').addEventListener('click', function () {
                calendarShiftPeriod(1);
            });
            document.getElementById('today-btn').addEventListener('click', function () {
                calendarGoToday();
            });
            document.getElementById('toggle-side-panel-btn').addEventListener('click', function () {
                calendarToggleSidePanel();
            });
            document.getElementById('toggle-todo-periods-btn').addEventListener('click', function () {
                calendarToggleTodoPeriods();
            });
            document.querySelectorAll('.view-mode-btn').forEach(function (button) {
                button.addEventListener('click', function () {
                    changeView(button.getAttribute('data-mode'));
                });
            });
            document.getElementById('event-kind').addEventListener('change', function () {
                calendarUpdateFormMode();
            });
            document.getElementById('todo-task-modal-form').addEventListener('submit', function (e) {
                e.preventDefault();
                saveTodoTaskFromModal();
            });
            document.getElementById('todo-modal-close').addEventListener('click', function () {
                closeTodoTaskModal();
            });
            document.getElementById('todo-modal-close-x').addEventListener('click', function () {
                closeTodoTaskModal();
            });
            document.getElementById('todo-modal-add-subtask').addEventListener('click', function () {
                addModalSubtask();
            });
            document.getElementById('todo-modal-new-subtask').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addModalSubtask();
                }
            });
            document.getElementById('todo-task-modal').addEventListener('click', function (e) {
                if (e.target === this) {
                    closeTodoTaskModal();
                }
            });

            const titleInput = document.getElementById('calendar-title-input');
            titleInput.addEventListener('input', function () {
                calendarTitle = titleInput.value.trim() || 'Calendrier';
                calendarSaveData();
            });

            document.getElementById('event-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const kindInput = document.getElementById('event-kind');
                const titleInput = document.getElementById('event-title');
                const dateInput = document.getElementById('event-date');
                const timeInput = document.getElementById('event-time');
                const notesInput = document.getElementById('event-notes');
                const categoryInput = document.getElementById('todo-category');
                const priorityInput = document.getElementById('todo-priority');
                const title = titleInput.value.trim();
                const date = calendarNormalizeDateValue(dateInput.value);
                if (!title || !date) return;

                if (kindInput && kindInput.value === 'todo') {
                    const ok = await calendarCreateTodoTaskFromForm({
                        title,
                        date,
                        category: categoryInput ? categoryInput.value : 'Général',
                        priority: priorityInput ? priorityInput.value : 'medium',
                        notes: notesInput.value || ''
                    });
                    if (!ok) return;
                } else {
                    calendarAddEvent({
                        title,
                        date,
                        time: timeInput.value || '',
                        notes: notesInput.value || ''
                    });
                }

                titleInput.value = '';
                timeInput.value = '';
                notesInput.value = '';
                dateInput.value = date;
            });

            document.getElementById('calendar-sync-box').addEventListener('input', function () {
                try {
                    const data = JSON.parse(this.value);
                    calendarSetState(data);
                } catch (e) {
                    // Laisse l'utilisateur finir de coller/éditer le JSON.
                }
            });

            document.getElementById('copy-calendar-btn').addEventListener('click', function () {
                const json = JSON.stringify(calendarGetStateObject(), null, 2);
                function fallbackCopy(text) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    try { document.execCommand('copy'); } catch (_) { }
                    document.body.removeChild(ta);
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(json).then(function () {
                        alert('Calendrier (JSON) copié dans le presse-papiers');
                    }).catch(function () {
                        fallbackCopy(json);
                        alert('Calendrier (JSON) copié dans le presse-papiers');
                    });
                } else {
                    fallbackCopy(json);
                    alert('Calendrier (JSON) copié dans le presse-papiers');
                }
            });

            document.getElementById('reload-calendar-btn').addEventListener('click', function () {
                calendarCloudLoad();
            });

            window.addEventListener('keydown', function (e) {
                if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    calendarCloudSave({ silent: true });
                } else if (e.key === 'Escape') {
                    closeTodoTaskModal();
                }
            });

            window.addEventListener('storage', function (e) {
                if (e.key === calendarStorageKey() && calendarCanUseLocalStorage) {
                    calendarLoadData();
                    calendarRenderTitle();
                    calendarRender();
                }
            });
        }

        function calendarInit() {
            calendarEnsureSharedKey();
            calendarUpdateTopTabs();
            calendarLoadData();
            calendarRenderTitle();
            calendarUpdateSyncBox();

            const eventDate = document.getElementById('event-date');
            if (eventDate && !eventDate.value) {
                syncEventFormDateWithSelection();
            }
            calendarRenderTodoCategoryOptions();
            calendarUpdateFormMode();

            calendarBindKeyModal();
            calendarBindControls();
            calendarRender();

            if (!calendarActiveKey()) {
                calendarSetCloudStatus('clé requise', 'err', { persist: true });
                calendarShowKeyModal(true);
                return;
            }

            calendarInitFirebase();
            calendarCloudLoad();
        }

        if (typeof window !== 'undefined') {
            window.calendarGetState = calendarGetState;
            window.calendarSetState = calendarSetState;
        }

        document.addEventListener('DOMContentLoaded', function () {
            calendarInit();
        });
    </script>
</body>

</html>
