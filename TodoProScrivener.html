<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection TodoPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
        }
        a {
            color: #a8d6e8;
        }
    </style>
    <script>
        (function redirectToOfficialTodo() {
            const target = new URL('todo.html', location.href);
            target.search = location.search;
            target.hash = location.hash;
            location.replace(target.href);
        })();
    </script>
</head>
<body>
    <p>La Todo officielle est maintenant <a id="official-todo-link" href="todo.html">todo.html</a>.</p>
    <script>
        (function updateFallbackLink() {
            const link = document.getElementById('official-todo-link');
            if (!link) return;
            const target = new URL('todo.html', location.href);
            target.search = location.search;
            target.hash = location.hash;
            link.href = target.href;
        })();
    </script>
</body>
</html>
