<html lang="fr"><head>
    <meta charset="UTF-8">
    <title>Todo List Suivi Roman</title>
    <style>
        /* Mode sombre permanent */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        /* Styles pour les sections */
        .section {
            margin-bottom: 20px;
        }
        .section-header {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .section-title {
            margin-left: 10px;
            font-size: 1.5em;
            color: #ffffff;
        }
        .section-content {
            display: block;
        }
        .section.collapsed .section-content {
            display: none;
        }
        .toggle-icon {
            font-size: 1.5em;
            background: none;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            padding: 0;
        }
        /* Styles pour les tâches */
        .task {
            background-color: #1e1e1e;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            border-left: 5px solid transparent; /* Barre de priorité */
        }
        .task-header {
            display: flex;
            align-items: center;
        }
        .task.completed .task-title {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task-details {
            display: none;
            margin-top: 10px;
            width: 100%;
        }
        .task.expanded .task-details {
            display: block;
        }
        .task-title {
            margin-left: 10px;
            color: #e0e0e0;
            flex: 1;
            cursor: pointer;
        }
        .task-title-input {
            margin-left: 10px;
            flex: 1;
            padding: 5px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333333;
            outline: none;
        }
        .task-category {
            margin-left: 10px;
            color: #e0e0e0;
            font-size: 0.9em;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .task-due-date {
            margin-left: 10px;
            color: #e0e0e0;
            font-size: 0.9em;
        }
        .task-subtasks-count {
            margin-left: 10px;
            color: #e0e0e0;
            font-size: 0.9em;
        }
        /* Boutons */
        button {
            background-color: #333333;
            color: #e0e0e0;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 5px;
        }
        button:hover {
            background-color: #444444;
        }
        /* Inputs */
        input[type="text"], select, textarea {
            padding: 10px;
            margin-right: 10px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333333;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        /* Styles pour les sous-tâches */
        .subtasks {
            list-style: none;
            padding-left: 0;
        }
        .subtasks li {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .subtasks input[type="checkbox"] {
            margin-right: 10px;
        }
        .subtask-title {
            flex: 1;
            cursor: pointer;
        }
        .subtask-title-input {
            flex: 1;
            padding: 5px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333333;
            outline: none;
        }
        /* Styles pour les catégories */
        .category-list {
            list-style: none;
            padding: 0;
        }
        .category-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            cursor: move;
        }
        .category-handle {
            cursor: move;
            margin-right: 10px;
            font-size: 1.2em;
        }
        .category-name {
            flex: 1;
            cursor: pointer;
        }
        .category-name-input {
            flex: 1;
            padding: 5px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333333;
            outline: none;
        }
        /* Style du bouton de dépliage */
        .toggle-button {
            background: none;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 16px;
        }
        /* Styles pour les priorités */
        .priority-low {
            border-left-color: green;
        }
        .priority-medium {
            border-left-color: orange;
        }
        .priority-high {
            border-left-color: red;
        }

            color: #e0e0e0;
            border: none;
            padding: 10px;
            cursor: pointer;

            margin-right: 10px;
        }

            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333333;

        .action-buttons button {

        .action-buttons button:hover {
            background-color: #383838;
        }

        #categories-section.collapsed #category-list {
            display: block !important;     /* Force l’affichage même si .section-content est masqué */
            margin-top: 10px;

            display: none;                 /* Masque les boutons "Supprimer" */

    /* --- Cloud status badge --- */

    /* --- Titre du projet --- */

<textarea id="sync-data" style="display:none;"></textarea>

<script>
        // Déclarations de variables globales
        let tasks = [];
        let categories = [];
        let sectionStates = {}; // Pour stocker l'état des sections
        let lastAction = null; // Pour stocker la dernière action effectuée
let sortCriteria = []; // Pour stocker les critères de tri
let canUseLocalStorage = false; // indicateur: localStorage utilisable
let projectTitle = 'TITRE'; // Nom lisible du projet (affiché en haut)

// === Auto-save vers Firebase (avec anti-spam) ===
let autosaveTimer = null;
const AUTOSAVE_DELAY = 800; // ms de silence avant d'enregistrer
let suppressAutoSave = false; // pour éviter un renvoi immédiat après un chargement cloud

function scheduleCloudSave() {
    if (!fbDocRef && !initFirebase()) return; // pas de Firebase -> ne fait rien
    if (autosaveTimer) clearTimeout(autosaveTimer);
    setCloudStatus('modifié — sauvegarde…');
    autosaveTimer = setTimeout(function(){
        cloudSave({ silent: true });
        autosaveTimer = null;
    }, AUTOSAVE_DELAY);
}

const CLOUD_BADGE_MODE = 'errors'; // 'off' = jamais, 'errors' = seulement erreurs, 'all' = tout

function setCloudStatus(text, cls, opts) {
    // Gestion d'affichage : 'off' (jamais), 'errors' (seulement erreurs), 'all' (tout)
    if (CLOUD_BADGE_MODE === 'off') return;
    if (CLOUD_BADGE_MODE === 'errors' && cls !== 'err') return;

    const el = document.getElementById('cloud-status');
    if (!el) return;
    opts = opts || {};
    const persist = !!opts.persist; // si true, on ne masque pas automatiquement

    el.textContent = `Cloud: ${text}`;
    el.classList.remove('ok', 'err');
    if (cls) el.classList.add(cls);
    el.style.display = 'block';

    // auto-hide pour les statuts non "err" (sauf si persist)
    clearTimeout(el._hideTimer);
    if (cls !== 'err' && !persist) {
        el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 1600);
    }
}

        // Multi-projet : clé projet depuis l'URL (?k=UUID) → isole Firestore et localStorage par projet
const _params = new URLSearchParams(location.search);
const URL_KEY = _params.get('k');
const IS_UUID = /^[a-f0-9-]{36}$/i.test(URL_KEY || '');
const PROJECT_KEY = IS_UUID ? URL_KEY : null;
const REQUIRE_KEY_IF_NO_QUERY = true; // si pas de ?k=..., on exige une clé via le modal

const STORAGE_BASE = 'TodoProV1';
let STORAGE_KEY = (function(){
    const initial = String(PROJECT_KEY || window.FB_SHARED_KEY || '').trim();
    return initial ? `${STORAGE_BASE}:${initial}` : STORAGE_BASE;
})();
let LS_FBKEY = PROJECT_KEY ? `FB_SHARED_KEY:${PROJECT_KEY}` : 'FB_SHARED_KEY';

function updateStorageKeyForActiveProject(){
    const active = String(window.FB_SHARED_KEY || PROJECT_KEY || '').trim();
    STORAGE_KEY = active ? `${STORAGE_BASE}:${active}` : STORAGE_BASE;
}

        (function testLocalStorage() {
            try {
                const t = '__ls_test__';
                localStorage.setItem(t, '1');
                localStorage.removeItem(t);
                canUseLocalStorage = true;
            } catch (e) {
                canUseLocalStorage = false; // navigation privée, quota, webview éphémère, etc.
            }
        })();

        // Charger les données depuis le stockage (localStorage prioritaire, sinon <textarea> caché)
        function loadData() {
            const syncTextarea = document.getElementById('sync-data');
            let jsonText = '';

            // 1) priorité au localStorage
            if (canUseLocalStorage) {
                jsonText = localStorage.getItem(STORAGE_KEY) || '';
            }

            // 2) sinon, on retombe sur le <textarea> caché
            if (!jsonText) {
                jsonText = syncTextarea.value || '';
            }

            try {
                const data = JSON.parse(jsonText || '{}');
                tasks = data.tasks || [];
                categories = data.categories || [];
                sectionStates = data.sectionStates || {};
                sortCriteria = data.sortCriteria || [];
                projectTitle = data.projectTitle || 'TITRE';
            } catch (e) {
                console.warn('Erreur chargement :', e);
                tasks = [];
                categories = [];
                sectionStates = {};
                sortCriteria = [];
                projectTitle = 'TITRE';
            }

            if (!categories.some(cat => cat.name === 'Général')) {
                categories.push({ name: 'Général', color: '#ffffff' });
            }
        }

function saveData() {
    const syncTextarea = document.getElementById('sync-data');
    const data = { tasks, categories, sectionStates, sortCriteria, projectTitle };
    const jsonData = JSON.stringify(data, null, 2);

    // Écrit dans le <textarea> (compatibilité + export manuel)
    syncTextarea.value = jsonData;

    // Essaie d’écrire dans localStorage
    if (canUseLocalStorage) {
        try {
            localStorage.setItem(STORAGE_KEY, jsonData);
        } catch (e) {
            console.warn('localStorage indisponible/plein, fallback <textarea> utilisé.', e);
        }
    }

    updateSyncBox();
    // Auto-save vers le cloud (debounce). Si on vient d'un chargement cloud, on saute une fois.
    if (typeof suppressAutoSave !== 'undefined') {
        if (!suppressAutoSave) {
            scheduleCloudSave();
        } else {
            suppressAutoSave = false;
        }
    }
}

        function updateSyncBox() {
            const syncBox = document.getElementById('sync-box');
            const data = { tasks, categories, sectionStates, sortCriteria, projectTitle };
            syncBox.value = JSON.stringify(data, null, 2);
        }

// === Synchronisation iCloud via Raccourcis ===
// Renvoie l'état complet au format JSON (string)
function todoGetState() {
    const data = { tasks, categories, sectionStates, sortCriteria, projectTitle };
    return JSON.stringify(data);
}

// Charge un état JSON (string ou objet) et réaffiche
function todoSetState(state) {
    try {
        const obj = (typeof state === 'string') ? JSON.parse(state) : state;
        tasks = obj.tasks || [];
        categories = obj.categories || [];
        sectionStates = obj.sectionStates || {};
        sortCriteria = obj.sortCriteria || [];
        projectTitle = obj.projectTitle || 'TITRE';

        // Persiste aussi dans localStorage / <textarea>
        saveData();

        // Rafraîchit l'UI
        renderCategories();

let fbApp = null, db = null, fbDocRef = null;
function initFirebase() {
    const requireKey = REQUIRE_KEY_IF_NO_QUERY && !PROJECT_KEY;

    // Seed depuis l’URL UNE SEULE FOIS (ne pas écraser une clé choisie via le modal)
    if (!window.FB_SHARED_KEY && PROJECT_KEY) {

    }
    updateStorageKeyForActiveProject();

    // Si on exige une clé et qu'on n'en a pas encore, on stoppe ici (le modal s’en chargera à l’étape 3)
    if (requireKey && !window.FB_SHARED_KEY) {
        setCloudStatus('clé requise', 'err', { persist: true });
        return false;
    }

    // Persiste uniquement la clé actuellement active (pas forcément celle de l’URL)
    if (window.FB_SHARED_KEY) {
        try { localStorage.setItem('FB_SHARED_KEY', window.FB_SHARED_KEY); } catch(_) {}
        try { localStorage.setItem(LS_FBKEY, window.FB_SHARED_KEY); } catch(_) {}
    }

    const cfgOk = ensureFirebaseConfig();
    const keyOk = !!window.FB_SHARED_KEY;

    if (!cfgOk || !keyOk) {
        console.warn('Firebase non configuré: config/clé manquantes. Sauvegarde locale seulement.');
        setCloudStatus('non configuré', 'err');
        return false;
    }

    try {
        fbApp = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(window.FB_CONFIG);
        db = firebase.firestore();
        fbDocRef = db.collection('todopro').doc(String(window.FB_SHARED_KEY));

        // (Re)branche l’écouteur temps réel sur le bon document
        if (window._fbUnsub) { try { window._fbUnsub(); } catch(_) {} }
        window._fbUnsub = fbDocRef.onSnapshot(function(snap){
            // Ignore les écritures locales (évite l’effet ping-pong)
            if (snap.metadata && snap.metadata.hasPendingWrites) return;
            if (!snap.exists) return;
            const d = snap.data();
            if (d && d.state) {
                suppressAutoSave = true; // évite une ré-écriture immédiate
                todoSetState(d.state);
            }
        }, function(err){
            console.warn('onSnapshot erreur:', err);
            setCloudStatus('écoute échouée (' + (err.code || err.message || 'inconnu') + ')', 'err');
        });

        setCloudStatus('connecté', 'ok');
        return true;
    } catch (e) {
        console.warn('Init Firebase échoué :', e);
        setCloudStatus('échec init (' + (e.code || e.message || 'inconnu') + ')', 'err');
        return false;
    }
}

async function cloudLoad() {
    if (!fbDocRef && !initFirebase()) return;
    try {
        setCloudStatus('chargement…');
        const snap = await fbDocRef.get();
        if (snap.exists) {
            const data = snap.data();
            if (data && data.state) {
                // Accepte objet ou string
                suppressAutoSave = true;
                todoSetState(data.state);
                setCloudStatus('chargé', 'ok');
            }
        }
    } catch (e) {
        console.warn('cloudLoad() échec :', e);
        setCloudStatus('lecture échouée (' + (e.code || e.message || 'inconnu') + ')', 'err');
    }
}

async function cloudSave(options) {
    options = options || {};
    const silent = !!options.silent;
    if (!fbDocRef && !initFirebase()) return;
    try {
        setCloudStatus('sauvegarde…');
        const stateStr = todoGetState();
        const stateObj = JSON.parse(stateStr);
        await fbDocRef.set({
            state: stateObj,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        setCloudStatus('sauvegardé', 'ok');
        if (!silent) alert('Sauvegardé dans le cloud ✅');
    } catch (e) {
        console.warn('cloudSave() échec :', e);
        setCloudStatus('échec sauvegarde (' + (e.code || e.message || 'inconnu') + ')', 'err');
        if (!silent) alert('Échec sauvegarde cloud ❌');

        // Fonction pour parser les dates
        function parseDate(input) {
            input = input.trim();
            let day, month, year;
            let date;

            // Format dd/MM/yyyy ou d/M/yyyy
            const regexDMY = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/;
            const matchDMY = input.match(regexDMY);
            if (matchDMY) {
                day = parseInt(matchDMY[1]);
                month = parseInt(matchDMY[2]) - 1; // Les mois commencent à 0
                year = parseInt(matchDMY[3]);
                date = new Date(year, month, day);
                if (!isNaN(date)) return date;
            }

            // Format yyyyMMdd
            const regexYMDCompact = /^(\d{4})(\d{2})(\d{2})$/;
            const matchYMDCompact = input.match(regexYMDCompact);
            if (matchYMDCompact) {
                year = parseInt(matchYMDCompact[1]);
                month = parseInt(matchYMDCompact[2]) - 1;
                day = parseInt(matchYMDCompact[3]);
                date = new Date(year, month, day);
                if (!isNaN(date)) return date;
            }

            // Format yyyy-MM-dd
            const regexYMD = /^(\d{4})-(\d{1,2})-(\d{1,2})$/;
            const matchYMD = input.match(regexYMD);
            if (matchYMD) {
                year = parseInt(matchYMD[1]);
                month = parseInt(matchYMD[2]) - 1;
                day = parseInt(matchYMD[3]);
                date = new Date(year, month, day);
                if (!isNaN(date)) return date;
            }

            // Format ddMMyyyy
            const regexDMYCompact = /^(\d{2})(\d{2})(\d{4})$/;
            const matchDMYCompact = input.match(regexDMYCompact);
            if (matchDMYCompact) {
                day = parseInt(matchDMYCompact[1]);
                month = parseInt(matchDMYCompact[2]) - 1;
                year = parseInt(matchDMYCompact[3]);
                date = new Date(year, month, day);
                if (!isNaN(date)) return date;
            }

            // Format ISO standard ou autres formats reconnus par Date.parse()
            date = new Date(input);
            if (!isNaN(date)) return date;

            return null;
        }

        // Rendre les tâches
        function renderTasks() {

            if (sortCriteria.length > 0) {

                        let comparison = 0;
                        if (criterion === 'dueDate') {
                            const dateA = a.dueDate ? new Date(a.dueDate) : new Date(8640000000000000); // Date max si pas de date
                            const dateB = b.dueDate ? new Date(b.dueDate) : new Date(8640000000000000);
                            comparison = dateA - dateB;
                        } else if (criterion === 'category') {
                            comparison = a.category.localeCompare(b.category);
                        } else if (criterion === 'priority') {
                            const priorityOrder = { 'high': 1, 'medium': 2, 'low': 3 };
                            comparison = priorityOrder[a.priority] - priorityOrder[b.priority];
                        }
                        if (comparison !== 0) return comparison;

                // Fonction pour déterminer la couleur du texte en fonction de la luminosité
                function getContrastYIQ(hexcolor) {
                    hexcolor = hexcolor.replace("#", "");
                    const r = parseInt(hexcolor.substr(0,2),16);
                    const g = parseInt(hexcolor.substr(2,2),16);
                    const b = parseInt(hexcolor.substr(4,2),16);
                    const yiq = ((r*299)+(g*587)+(b*114))/1000;
                    return (yiq >= 128) ? '#000000' : '#FFFFFF';

                        // Calculer le temps restant en jours, heures, semaines
                        const diffInSeconds = Math.abs(timeDiff) / 1000;
                        const diffInMinutes = Math.floor(diffInSeconds / 60);
                        const diffInHours = Math.floor(diffInMinutes / 60);
                        const diffInDays = Math.floor(diffInHours / 24);
                        const diffInWeeks = Math.floor(diffInDays / 7);

                        let timeRemainingText = '';
                        if (diffInWeeks >= 1) {
                            timeRemainingText = `${diffInWeeks} semaine${diffInWeeks > 1 ? 's' : ''}`;
                        } else if (diffInDays >= 1) {
                            timeRemainingText = `${diffInDays} jour${diffInDays > 1 ? 's' : ''}`;
                        } else if (diffInHours >= 1) {
                            timeRemainingText = `${diffInHours} heure${diffInHours > 1 ? 's' : ''}`;
                        } else {

                        }

                        if (isOverdue && !task.completed) {
                            dueDateSpan.textContent = `En retard de ${timeRemainingText}`;
                            dueDateSpan.style.color = 'red';
                        } else if (!isOverdue && !task.completed) {
                            dueDateSpan.textContent = `${timeRemainingText} restant${diffInMinutes > 1 ? 's' : ''}`;

                    // Titre de la sous-tâche (édition en ligne)

                    // Événement pour passer en mode édition
                    subSpan.addEventListener('click', function() {

                        input.className = 'subtask-title-input';
                        input.value = subtask.title;
                        li.replaceChild(input, subSpan);

                            }

        // Fonction pour appliquer les filtres
        function applyFilters(taskArray) {
            let filteredTasks = [...taskArray];

            // Filtre par statut (toutes, complétées, actives)
            const statusFilterButtons = document.querySelectorAll('[data-filter]');
            let statusFilter = 'all';
            statusFilterButtons.forEach(button => {
                if (button.classList.contains('active-filter')) {
                    statusFilter = button.getAttribute('data-filter');
                }
            });

            if (statusFilter === 'completed') {
                filteredTasks = filteredTasks.filter(task => task.completed);
            } else if (statusFilter === 'active') {
                filteredTasks = filteredTasks.filter(task => !task.completed);
            }

            // Filtre par catégorie
            const categoryFilter = document.getElementById('filter-category').value;
            if (categoryFilter !== 'all') {
                filteredTasks = filteredTasks.filter(task => task.category === categoryFilter);
            }

            // Filtre par priorité
            const priorityFilter = document.getElementById('filter-priority').value;
            if (priorityFilter !== 'all') {
                filteredTasks = filteredTasks.filter(task => task.priority === priorityFilter);
            }

            // Filtre par date
            const dateFilter = document.getElementById('filter-date').value;
            if (dateFilter !== 'all') {
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                if (dateFilter === 'today') {
                    filteredTasks = filteredTasks.filter(task => {
                        const taskDate = new Date(task.dueDate);
                        return task.dueDate && taskDate.getTime() === today.getTime();
                    });
                } else if (dateFilter === 'tomorrow') {
                    const tomorrow = new Date(today);
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    filteredTasks = filteredTasks.filter(task => {
                        const taskDate = new Date(task.dueDate);
                        return task.dueDate && taskDate.getTime() === tomorrow.getTime();
                    });
                } else if (dateFilter === 'this_week') {
                    const weekStart = new Date(today);
                    const weekEnd = new Date(today);
                    weekEnd.setDate(weekEnd.getDate() + 7);
                    filteredTasks = filteredTasks.filter(task => {
                        const taskDate = new Date(task.dueDate);
                        return task.dueDate && taskDate >= weekStart && taskDate < weekEnd;
                    });
                } else if (dateFilter === 'overdue') {
                    filteredTasks = filteredTasks.filter(task => {
                        const taskDate = new Date(task.dueDate);
                        return task.dueDate && taskDate < today && !task.completed;
                    });
                }
            }

            return filteredTasks;
        }

        // Fonction pour activer le bouton Annuler
        function enableUndoButton() {

        // Fonction pour annuler la dernière action
        document.getElementById('undo-btn').addEventListener('click', function() {
            if (lastAction) {
                switch (lastAction.type) {
                    case 'deleteTask':
                        // Restaurer la tâche supprimée
                        tasks.push(lastAction.task);
                        saveData();
                        renderTasks();
                        break;
                    case 'deleteCategory':
                        // Restaurer la catégorie supprimée
                        categories.push(lastAction.category);
                        // Restaurer les tâches affectées
                        tasks.forEach(task => {
                            if (lastAction.tasks.some(t => t.id === task.id)) {
                                task.category = lastAction.category.name;
                            }
                        });
                        saveData();
                        renderCategories();
                        renderTasks();
                        break;
                    case 'editCategory':
                        // Restaurer le nom de la catégorie
                        const category = categories.find(cat => cat.name === lastAction.newName);
                        if (category) {
                            category.name = lastAction.oldName;
                            // Mettre à jour les tâches associées
                            tasks.forEach(task => {
                                if (task.category === lastAction.newName) {
                                    task.category = lastAction.oldName;
                                }
                            });
                            saveData();
                            renderCategories();
                            renderTasks();
                        }
                        break;
                    case 'reset':
                        // Restaurer les données précédentes
                        tasks = lastAction.tasks;
                        categories = lastAction.categories;
                        sectionStates = lastAction.sectionStates;
                        sortCriteria = [];
                        saveData();
                        renderTasks();
                        renderCategories();
                        applySectionStates();
                        break;
                }
                lastAction = null;
                disableUndoButton();
            }
        });

        // --- Modal: Charger un autre projet ---
        let _keyModalForce = false; // quand true, la popup ne peut pas être fermée tant qu'une clé valide n'est pas fournie
        function showKeyModal(force) {
            _keyModalForce = !!force;
            const m = document.getElementById('key-modal');
            const input = document.getElementById('key-input');
            const err = document.getElementById('key-error');
            if (!m || !input || !err) return;
            err.textContent = 'Clé invalide. Format attendu : UUID v4.';
            err.style.display = 'none';
            input.value = '';
            m.style.display = 'flex';
            setTimeout(() => input.focus(), 0);
        }
        function hideKeyModal() {
            const m = document.getElementById('key-modal');
            if (m) m.style.display = 'none';
        }
        (function bindKeyModal(){
            const input = document.getElementById('key-input');
            const err = document.getElementById('key-error');
            const cancelBtn = document.getElementById('key-cancel');
            const confirmBtn = document.getElementById('key-confirm');
            if (!input || !err || !cancelBtn || !confirmBtn) return;

            async function acceptKey(){
                const newKey = String(input.value || '').trim();
                const UUID_V4 = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
                if (!UUID_V4.test(newKey)) { 
                    err.textContent = 'Clé invalide. Format attendu : UUID v4.';
                    err.style.display = 'block'; 
                    return; 
                }

                try { localStorage.setItem('FB_SHARED_KEY', newKey); } catch(_) {}
                try { localStorage.setItem(LS_FBKEY, newKey); } catch(_) {}
                window.FB_SHARED_KEY = newKey;
                updateStorageKeyForActiveProject();

                // Réinitialise l’écouteur si présent
                if (window._fbUnsub) { try { window._fbUnsub(); } catch(_) {} }
                fbDocRef = null;

                setCloudStatus('changement de projet…');
                const ok = initFirebase();
                if (!ok || !fbDocRef) {
                    err.textContent = "Impossible d’initier le projet (clé invalide ou non autorisée).";
                    err.style.display = 'block';
                    return;
                }
                try {
                    // Test de lecture: déclenchera une erreur si la clé n'est pas autorisée par les règles
                    await fbDocRef.get();
                } catch (e) {
                    err.textContent = 'Clé non autorisée ou inexistante dans Firestore.';
                    err.style.display = 'block';
                    setCloudStatus('permission refusée', 'err', { persist: true });
                    return;
                }

                // Si le document n'existe pas encore, on l'initialise automatiquement avec un état VIERGE
                try {
                    const snap = await fbDocRef.get();
                    if (!snap.exists) {
                        const initialState = {
                            tasks: [],
                            categories: [{ name: 'Général', color: '#ffffff' }],
                            sectionStates: {},
                            sortCriteria: [],
                            projectTitle: 'TITRE'
                        };
                        await fbDocRef.set({
                            state: initialState,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                        // Applique localement sans relancer un auto-save immédiat
                        suppressAutoSave = true;
                        todoSetState(initialState);
                        setCloudStatus('projet initialisé', 'ok');
                    }
                } catch (e) {
                    console.warn('Initialisation projet échouée :', e);
                    // On laisse continuer: cloudLoad() gérera l’affichage si possible
                }

                await cloudLoad();
                setCloudStatus('projet chargé', 'ok');
                hideKeyModal();
            }

            confirmBtn.addEventListener('click', acceptKey);
            input.addEventListener('keydown', function(e){ if (e.key === 'Enter') acceptKey(); });
            cancelBtn.addEventListener('click', function(){
                if (_keyModalForce) {
                    err.textContent = 'Une clé valide est requise pour continuer.';
                    err.style.display = 'block';
                    return;
                }
                hideKeyModal();
            });
        })();
